<!DOCTYPE html>
<html>
<head>
    <title>yinka's Website</title>

    <style>
        body {
            background: linear-gradient(to right, #4facfe, #00f2fe);
            font-family: Arial, sans-serif;
            text-align: center;
            color: white;
            margin: 0;
            padding: 50px;
        }

        .card {
            background: rgba(255,255,255,0.15);
            padding: 30px;
            border-radius: 20px;
            max-width: 600px;
            margin: auto;
        }

        h1 {
            font-size: 3em;
        }

        button {
            background: white;
            color: #2196f3;
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
        }

        button:hover {
            background: #f0f0f0;
        }
        button {
    margin: 10px;
    background: white;
    color: #2196f3;
    border: none;
    padding: 15px 25px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 18px;
    font-weight: bold;
}

button:hover {
    transform: scale(1.1);
}
    </style>
</head>

<body>

<div class="card">

    <h1>🐉 Dragon Battle RPG</h1>

    <h2 id="heroName">Choose Your Hero</h2>

    <button onclick="chooseHero('🧙 Wizard',15)">🧙 Wizard</button>
    <button onclick="chooseHero('⚔️ Warrior',20)">⚔️ Warrior</button>
    <button onclick="chooseHero('🏹 Archer',18)">🏹 Archer</button>
  
    <hr>

    <p>❤️ Hero Health: <span id="heroHealth">100</span></p>
    <p>🐉 Dragon Health: <span id="dragonHealth">100</span></p>

    <p>⭐ Level: <span id="level">1</span></p>
    <p>💰 Gold: <span id="gold">0</span></p>
      <p>🗡️ Weapon: <span id="weapon">Wooden Sword</span></p>

<button onclick="buySword()">
    Buy Iron Sword (100 Gold)
</button>

<button onclick="saveGame()">
    💾 Save Game
</button>

<button onclick="loadGame()">
    📂 Load Game
</button>
    <p>🧪 Potions: <span id="potions">3</span></p>

    <button onclick="attack()">⚔️ Attack</button>
    <button onclick="heal()">🧪 Use Potion</button>

    <h3 id="log">Choose a hero to begin!</h3>

</div>

<script>
    let weapon = "Wooden Sword";
let weaponBonus = 0;
    

let hero = "";
let heroPower = 0;

let heroHealth = 100;
let dragonHealth = 100;

let level = 1;
let gold = 0;
let potions = 3;

function chooseHero(name,power){

    hero = name;
    heroPower = power;

    document.getElementById("heroName").innerHTML =
        "Hero: " + hero;

    document.getElementById("log").innerHTML =
        hero + " enters the battle!";
}

function attack(){

    if(hero === ""){
        document.getElementById("log").innerHTML =
            "Choose a hero first!";
        return;
    }

    let damage =
        Math.floor(Math.random() * heroPower) + 1;

    dragonHealth -= damage;

    if(dragonHealth < 0){
        dragonHealth = 0;
    }

    document.getElementById("dragonHealth").innerHTML =
        dragonHealth;

    if(dragonHealth === 0){

        gold += 50;
        level++;

        dragonHealth = 100 + (level * 20);

        document.getElementById("gold").innerHTML = gold;
        document.getElementById("level").innerHTML = level;
        document.getElementById("dragonHealth").innerHTML =
            dragonHealth;

        document.getElementById("log").innerHTML =
            "🏆 Dragon defeated! New dragon appears!";
        return;
    }

    dragonAttack();

    document.getElementById("log").innerHTML =
        hero + " hits for " + damage + " damage!";
}

function dragonAttack(){

    let damage =
        Math.floor(Math.random() * 15) + 1;

    heroHealth -= damage;

    if(heroHealth < 0){
        heroHealth = 0;
    }

    document.getElementById("heroHealth").innerHTML =
        heroHealth;

    if(heroHealth === 0){

        document.getElementById("log").innerHTML =
            "💀 Game Over!";
    }
}

function heal(){

    if(potions <= 0){

        document.getElementById("log").innerHTML =
            "No potions left!";
        return;
    }

    potions--;

    heroHealth += 30;

    if(heroHealth > 100){
        heroHealth = 100;
    }

    document.getElementById("potions").innerHTML =
        potions;

    document.getElementById("heroHealth").innerHTML =
        heroHealth;

    document.getElementById("log").innerHTML =
        "🧪 Potion used!";
}

</script>
    
</body>

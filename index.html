<!DOCTYPE html>
<html>
<head>
    <title>David's Website</title>

    <style>
        body {
            background: linear-gradient(to right, #4facfe, #00f2fe);
            font-family: Arial, sans-serif;
            text-align: center;
            color: white;
            margin: 0;
            padding: 50px;
        }

        .card {
            background: rgba(255,255,255,0.15);
            padding: 30px;
            border-radius: 20px;
            max-width: 600px;
            margin: auto;
        }

        h1 {
            font-size: 3em;
        }

        button {
            background: white;
            color: #2196f3;
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
        }

        button:hover {
            background: #f0f0f0;
        }
        button {
    margin: 10px;
    background: white;
    color: #2196f3;
    border: none;
    padding: 15px 25px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 18px;
    font-weight: bold;
}

button:hover {
    transform: scale(1.1);
}
    </style>
</head>

<body>

<div class="card">

    <h1>🐉 Hero vs Dragon</h1>

    <h2 id="hero">Choose Your Hero</h2>

    <button onclick="chooseHero('Wizard')">🧙 Wizard</button>
    <button onclick="chooseHero('Warrior')">⚔️ Warrior</button>
    <button onclick="chooseHero('Archer')">🏹 Archer</button>

    <hr>

    <h2>Dragon Health: <span id="dragonHealth">100</span> ❤️</h2>

    <button onclick="attack()">⚔️ Attack Dragon</button>

    <p id="battleLog"></p>

</div>

<script>

let currentHero = "";
let dragonHealth = 100;

function chooseHero(hero) {
    currentHero = hero;

    document.getElementById("hero").innerHTML =
        "Chosen Hero: " + hero;

    document.getElementById("battleLog").innerHTML =
        hero + " is ready for battle!";
}

function attack() {

    if (currentHero === "") {
        document.getElementById("battleLog").innerHTML =
            "Choose a hero first!";
        return;
    }

    let damage = Math.floor(Math.random() * 20) + 1;

    dragonHealth -= damage;

    if (dragonHealth < 0) {
        dragonHealth = 0;
    }

    document.getElementById("dragonHealth").innerHTML =
        dragonHealth;

    document.getElementById("battleLog").innerHTML =
        currentHero +
        " dealt " +
        damage +
        " damage!";

    if (dragonHealth === 0) {
        document.getElementById("battleLog").innerHTML =
            "🏆 Victory! The dragon has been defeated!";
    }
}

</script>

</body>

        }
    </script>

</body>
</html>

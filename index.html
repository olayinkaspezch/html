<!DOCTYPE html>
<html>
<head>
    <title>Yinka's Website</title>

    <style>
        body {
            background: linear-gradient(to right, #4facfe, #00f2fe);
            font-family: Arial, sans-serif;
            text-align: center;
            color: white;
            margin: 0;
            padding: 50px;
        }

        .card {
            background: rgba(255,255,255,0.15);
            padding: 30px;
            border-radius: 20px;
            max-width: 600px;
            margin: auto;
        }

        h1 {
            font-size: 3em;
        }

        button {
            background: white;
            color: #2196f3;
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
        }

        button:hover {
            background: #f0f0f0;
        }
    </style>
</head>

<body>

    <div class=" <h2>Choose Your Character</h2>

        <button>🧙 Wizard</button>
        <button>⚔️ Warrior</button>
        <button>🏹 Archer</button>
        <button>🐉 Dragon Rider</button>

        <button onclick="sayHello()">
            Click Me
        </button>

        <p id="message"></p>">
        <h1>👋 Welcome!</h1>

        <h2>My Name is yinka</h2>

        <p>
            I am learning HTML, CSS and JavaScript.
        </p>

        <p>
            This website is hosted on GitHub Pages.
        </p>
       
    </div>

    <script>
        function sayHello() {
            document.getElementById("message").innerHTML =
                "🚀 Great job! You just used JavaScript!";
        }
    </script>

</body>
</html>
